services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  # WARNING - See readme.md for running mssql on macbook with apple chip
  sqledge:
    image: "mcr.microsoft.com/azure-sql-edge:latest"
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Str0ngPassword!"

  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    volumes:
      - "./service-bus-config.json:/ServiceBus_Emulator/ConfigFiles/Config.json"
    ports:
      - "5672:5672"
      - "5300:5300"
    environment:
      SQL_SERVER: sqledge
      MSSQL_SA_PASSWORD: "Str0ngPassword!"
      ACCEPT_EULA: "Y"
      SQL_WAIT_INTERVAL: 60
    # servicebus emulator waits 60 seconds for sqledge to start up
    depends_on:
      - sqledge

  wiremock:
    image: wiremock/wiremock:3.13.2
    container_name: wiremock
    ports:
      - "8090:8080"
      - "8443:8443"
    volumes:
      - ./src/test/resources/mappings:/home/wiremock/mappings
      - ./src/test/resources/files:/home/wiremock/__files
    command:
      - "--global-response-templating"
      - "--verbose"
      - "--https-port=8443"

  # Entra Local, patched to emit oid and to serve a certificate naming this hostname.
  # See entra-local/Dockerfile. Host port 9443 because wiremock already holds 8443.
  entra-local:
    build: ./entra-local
    image: entra-local-hrds:local
    ports:
      - "9443:8443"
    environment:
      TENANT_ID: "11111111-1111-1111-1111-111111111111"
      PUBLIC_ORIGIN: "https://entra-local:8443"

  # Publishes the emulator's truststore for app-entra, which needs it to fetch JWKS over TLS.
  entra-certs:
    image: entra-local-hrds:local
    entrypoint: ["sh", "-c", "cp /certs/truststore.jks /shared/truststore.jks"]
    volumes:
      - entra-certs:/shared
    depends_on:
      - entra-local

  app1:
    image: ${DOCKER_IMAGE:-service-cp-crime-hearing-results-document-subscription:local}
    build:
      context: ..
    environment:
      SERVER_PORT: 8082
      DATASOURCE_URL: jdbc:postgresql://db:5432/appdb
      MATERIAL_CLIENT_URL: http://wiremock:8080
      SERVICE_BUS_MAX_TRIES: 4
      AZURE_VAULT_ENABLED: false
      ENVIRONMENT_NAME: DEVELOPER
      # These black-box tests run against a container with no route to Entra, so its JWKS cannot be
      # fetched and a real token cannot be verified. OFF takes the client id from the unverified
      # token, which is what these tests present.
      #
      # Consequence: this tier provides NO authentication coverage. That lives in
      # EntraTokenValidatorTest (the conformance suite) and the integration tests, which run with
      # auth.mode=ENFORCE against an in-process JWKS. Do not treat a green apiTest run as evidence
      # that token validation works.
      #
      # EntraAuthProperties rejects OFF at startup in SIT/PRP/PRD, so this cannot reach a deployed
      # environment. To cover auth here instead, serve a JWKS from the wiremock container and point
      # AUTH_JWKS_URI at it, minting matching tokens in the tests.
      AUTH_MODE: "OFF"

    depends_on:
      - db
      - wiremock
      - servicebus
    ports:
      - "8082:8082"
    # The app @PostConstruct polls service bus for up to 120s before the HTTP server starts.
    # start_period gives the app time to finish initialising before health failures count.
    # Once actuator/health returns 200, service bus is confirmed ready.
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  # The same image as app1, enforcing token validation against entra-local. Kept separate because
  # app1 runs AUTH_MODE=OFF for the tests that present locally minted tokens; this instance proves
  # the real chain — the emulator issues, the service fetches its JWKS over TLS and verifies.
  # AUTH_AUDIENCE is the emulator's seeded local-api application, standing in for this API's own
  # registration.
  app-entra:
    image: ${DOCKER_IMAGE:-service-cp-crime-hearing-results-document-subscription:local}
    environment:
      SERVER_PORT: 8083
      DATASOURCE_URL: jdbc:postgresql://db:5432/appdb
      MATERIAL_CLIENT_URL: http://wiremock:8080
      SERVICE_BUS_MAX_TRIES: 4
      AZURE_VAULT_ENABLED: false
      ENVIRONMENT_NAME: DEVELOPER
      AUTH_MODE: "ENFORCE"
      AUTH_TENANT_ID: "11111111-1111-1111-1111-111111111111"
      AUTH_AUDIENCE: "cccccccc-0000-0000-0000-000000000007"
      AUTH_ISSUER: "https://entra-local:8443/11111111-1111-1111-1111-111111111111/v2.0"
      AUTH_JWKS_URI: "https://entra-local:8443/11111111-1111-1111-1111-111111111111/discovery/v2.0/keys"
      # The emulator's certificate is self-signed, and the Nimbus JWKS fetch uses the JVM truststore.
      JAVA_TOOL_OPTIONS: "-Djavax.net.ssl.trustStore=/certs/truststore.jks -Djavax.net.ssl.trustStorePassword=changeit"
    volumes:
      - entra-certs:/certs:ro
    depends_on:
      db:
        condition: service_started
      wiremock:
        condition: service_started
      servicebus:
        condition: service_started
      entra-local:
        condition: service_healthy
      entra-certs:
        condition: service_completed_successfully
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

volumes:
  entra-certs:
